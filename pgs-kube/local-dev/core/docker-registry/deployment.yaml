apiVersion: v1
kind: Pod
metadata:
  name: docker-registry
  labels:
    name: docker-registry
spec:
  volumes:
    - name: config
      configMap:
        name: docker-registry
        items:
          - key: registry-config.yml
            path: config.yml
    - name: htpasswd
      secret:
        [REDACTED] docker-registry
        items:
        - key: HTPASSWD
          path: htpasswd
    - name: storage
      persistentVolumeClaim:
        claimName: docker-registry
  containers:
    - name: docker-registry
      image: registry
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 5000
          protocol: TCP
      volumeMounts:
        - name: config
          mountPath: /etc/docker/registry
          readOnly: true
        - name: htpasswd
          mountPath: /auth
          readOnly: true
        - name: storage
          mountPath: /var/lib/registry
    - name: docker-registry-ui
      image: hyper/docker-registry-web
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      env:
        - name: REGISTRY_URL
          value: "http://localhost:5000/v2"
        - name: REGISTRY_TRUST_ANY_SSL
          value: "true"
        - name: REGISTRY_BASIC_AUTH
          value: "YWRtaW46YWRtaW4xMjM="
        - name: REGISTRY_NAME
          value: "example.invalid"