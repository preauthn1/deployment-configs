apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: reverse-proxy
  annotations:
    example.invalid/ingress.class: nginx
    example.invalid/proxy-body-size: "0"
    example.invalid/proxy-pass-headers: "Content-Type"
spec:
  tls:
  - hosts:
    - example.invalid
    - example.invalid
    secretName: docker-registry-tls-certificate
  rules:
  - host: example.invalid
    http:
      paths:
      - backend:
          serviceName: reverse-proxy
          servicePort: 80
  - host: example.invalid
    http:
      paths:
      - backend:
          serviceName: reverse-proxy
          servicePort: 80