apiVersion: v1
kind: Pod
metadata:
  name: reverse-proxy
  labels:
    name: reverse-proxy
spec:
  volumes:
    - name: config
      configMap:
        name: reverse-proxy
        items:
          - key: default.conf
            path: default.conf
  containers:
    - name: reverse-proxy
      image: nginx:1.16.1
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 80
          protocol: TCP
      volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true