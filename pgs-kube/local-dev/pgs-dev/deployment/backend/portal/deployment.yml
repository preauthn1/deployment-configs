apiVersion: v1
kind: Service
metadata:
  name: svc-backend-portal
  namespace: target-dev
spec:
  type: LoadBalancer
  ports:
    - name: portal
      port: 9527
      protocol: TCP
  selector:
    name: backend-portal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    example.invalid/auto: "true"
  name: deployment-backend-portal
  namespace: target-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      name: backend-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      annotations:
        version/config: "20200410008"
      labels:
        name: backend-portal
    spec:
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: api
          configMap:
            name: backend-portal
            items:
              - key: .env.production
                path: .env.production
        - name: storage
          emptyDir: {}
      containers:
        - name: backend-portal
          image: example.invalid/target/backend/portal
          #imagePullPolicy: IfNotPresent
          imagePullPolicy: Always
          ports:
            - name: portal
              containerPort: 9527
              protocol: TCP
          volumeMounts:
            - name: api
              mountPath: /usr/src/app/.env.production
              subPath: .env.production
              readOnly: true