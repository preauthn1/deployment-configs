apiVersion: v1
kind: Service
metadata:
  name: svc-game-slot-tgw-1
  namespace: target-dev
spec:
  type: ClusterIP
  ports:
    - port: 13201
      protocol: TCP
  selector:
    name: game-slot-tgw-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    example.invalid/auto: "true"
  name: deployment-game-slot-tgw-1
  namespace: target-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      name: game-slot-tgw-1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  minReadySeconds: 5
  template:
    metadata:
      annotations:
        version/config: "20200316002"
      labels:
        name: game-slot-tgw-1
    spec:
      imagePullSecrets:
        - name: regcred
      volumes:
        - name: api
          configMap:
            name: game-apiserver
            items:
              - key: apiserver-api.dat
                path: api.dat
        - name: tgw-1
          configMap:
            name: game-slot-tgw
            items:
              - key: tgw-1-slotconfig.dat
                path: slotconfig.dat
              - key: tgw-1-gameserver.dat
                path: gameserver.dat
              - key: tgw-1-serverinfo.dat
                path: serverinfo.dat
        - name: protodata
          configMap:
            name: game-slot-protodata-qa
        - name: storage
          emptyDir: {}
      containers:
        - name: game-slot-tgw
          image: example.invalid/gameserver:beta
          #imagePullPolicy: IfNotPresent
          imagePullPolicy: Always
          env:
            - name: ENV_API_PATH
              value: "/app/apiserver"
            - name: ENV_API_NAME
              value: "apiserver"
            - name: ENV_APP_PATH
              value: "/app/gameserver/tgw"
            - name: ENV_APP_NAME
              value: "tgw"
          ports:
            - name: tgw-1
              containerPort: 13201
              protocol: TCP
          volumeMounts:
            - name: api
              mountPath: /app/apiserver/config
              readOnly: true
            - name: tgw-1
              mountPath: /app/gameserver/tgw/config
              readOnly: true
            - name: protodata
              mountPath: /app/gameserver/tgw/protodata
              readOnly: true