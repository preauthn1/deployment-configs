variables:
  VERSION: latest

stages:
  - deploy

demo dev:
  image: dtzar/helm-kubectl:3.0.0
  stage: deploy
  environment:
    name: demo dev
    url: http://example.invalid
  script:
    - helm upgrade -i -n target-dev demo-hall helm -f demo-dev.yaml --set image.tag=${VERSION}
  tags:
    - golang
  only:
    changes:
      - demo-dev.yaml

demo qa:
  image: dtzar/helm-kubectl:3.0.0
  stage: deploy
  environment:
    name: demo qa
    url: http://example.invalid
  when: manual
  script:
    - helm upgrade -i -n target-qa demo-hall helm -f demo-qa.yaml --set image.tag=${VERSION}
  tags:
    - golang
  only:
    changes:
      - demo-qa.yaml

pre-demo 正式:
  image: dtzar/helm-kubectl:3.0.0
  stage: deploy
  environment:
    name: demo
    url: http://example.invalid
  when: manual
  before_script:
    - mkdir -p $HOME/.kube
    - echo $KUBE_CONFIG | base64 -d > $HOME/.kube/config
    - kubectl config view
  script:
    - helm upgrade -i -n target pre-demo-hall helm -f pre-demo.yaml --set image.tag=${VERSION}
  tags:
    - golang
  only:
    changes:
      - pre-demo.yaml

