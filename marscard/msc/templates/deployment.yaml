apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    example.invalid/auto: "true"
  name: {{ include "msc.fullname" . }}
  labels:
    {{- include "msc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "msc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "msc.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
        - name: appsettings
          configMap:
            name: {{ .Release.Name }}-appsettings
            items:
              - key: appsettings-api-adminsys.json
                path: appsettings-api-adminsys.json
              - key: appsettings-api-point.json
                path: appsettings-api-point.json
              - key: appsettings-api-vendor.json
                path: appsettings-api-vendor.json
              - key: appsettings-web-adminsys.json
                path: appsettings-web-adminsys.json
              - key: appsettings-web-point.json
                path: appsettings-web-point.json
      serviceAccountName: {{ include "msc.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Dev
          volumeMounts:
            - name: appsettings
              mountPath: /app/appsettings.json
              subPath: "appsettings-{{ .example.invalid.name }}.json"
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
