build tgbot-php-app:
  extends: .build
  variables:
    # 建置來源專案
    TRIGGER_FROM_PROJECT: target/tgbot-php
    # 定義鏡像名
    IMAGE_NAME: tgbot-php-app
    # 建置用 Dockerfile
    BUILD_DOCKERFILE: build-dev/tgbot-php/Dockerfile-php-app
build tgbot-php-horizon:
  extends: .build
  variables:
    # 建置來源專案
    TRIGGER_FROM_PROJECT: target/tgbot-php
    # 定義鏡像名
    IMAGE_NAME: tgbot-php-horizon
    # 建置用 Dockerfile
    BUILD_DOCKERFILE: build-dev/tgbot-php/Dockerfile-php-horizon
build tgbot-php-schedule:
  extends: .build
  variables:
    # 建置來源專案
    TRIGGER_FROM_PROJECT: target/tgbot-php
    # 定義鏡像名
    IMAGE_NAME: tgbot-php-schedule
    # 建置用 Dockerfile
    BUILD_DOCKERFILE: build-dev/tgbot-php/Dockerfile-php-schedule
deploy tgbot-php (DEV):
  extends: .deploy
  stage: deploy-to-gke
  image: google/cloud-sdk:latest
  tags:
    - php
  needs:
    - "build tgbot-php-app"
    - "build tgbot-php-horizon"
    - "build tgbot-php-schedule"
  variables:
    # 建置來源專案
    TRIGGER_FROM_PROJECT: target/tgbot-php
    GKE_CLUSTER_NAME: cluster-1
    GKE_CLUSTER_ZONE: asia-east1-a
    GCP_PROJECT: tp-wz3-rd
    # 應用名
    APP_NAME: tgbot-php
    # 應用鏡像位置
    APP_IMAGE: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/sre/gff-cicd/cm/tgbot-php
    APP_PORT: 80
    DEPLOY_NS: tgbot
    DEPLOY_KEY_FILE: deploy-keys/tp-wz3-rd-deploy.json
    DEPLOY_VALUES_FILE: ./helm-charts/tgbot-php/values.yaml
    HELM_CHART_PATH: ./helm-charts/tgbot-php

deploy tgbot-php (Online):
  extends: .deploy
  stage: deploy-to-gke
  image: google/cloud-sdk:latest
  tags:
    - php
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $SRC_PROJECT == $TRIGGER_FROM_PROJECT && $SRC_COMMIT_BRANCH == "main"'
      when: on_success
    - when: never
  allow_failure: true
  variables:
    # 建置來源專案
    TRIGGER_FROM_PROJECT: target/tgbot-php
    GKE_CLUSTER_NAME: xsgcasino-cluster
    GKE_CLUSTER_ZONE: asia-southeast1-a
    GCP_PROJECT: tp-wz3-online
    # 應用名
    APP_NAME: tgbot-php
    # 應用鏡像位置
    APP_IMAGE: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024/sre/gff-cicd/cm/tgbot-php
    APP_PORT: 80
    DEPLOY_NS: tgbot
    DEPLOY_KEY_FILE: deploy-keys/tp-wz3-online-deploy.json
    DEPLOY_VALUES_FILE: ./helm-charts/tgbot-php/values-online.yaml
    HELM_CHART_PATH: ./helm-charts/tgbot-php
