            bettype=16,32           // 下注類型逗號區隔  16: 進球, 17: 進球-左, 18: 進球-中, 19: 進球 右, 32: 守住, 33: 守住-左, 34: 守住-中, 35: 守住-右
            line=20000             // 只要 進球，守住 相差超過平衡線，就會下令一邊，忽略 bettype (分) 5000.00

            // 隨機下進球或守住
