game:
  hhdz:
    id: 2200
    name: 红黑大战
    group: poker
    room:
      - serverid: 220000410
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2200                 //游戏I
            gamename=红黑大战             //游戏名称
            flag=41                     //显示名称,客户端可根据此名称将房间分类显示
            minplayer=1              //游戏最小人数
            maxplayer=500            //游戏最大人数
            tablecount=1             //桌子数
            seatcount=500            //椅子数
            loginmoney=0             //进入游戏最小积分
            scoremode=0                    //0 即时写分 1退房间写分
            maxuser=500                    //最大人数
            taxscale=5                    //抽水比例
            readywaittime=30            //举手超时时间,单位秒
            reghallserverinterval=5    //注册广场时间间隔,单位秒
            bettime=18                        //下注时间
            scoresection=0,2500000,            //分数段
            basescore=100                        //底分
            kaijiangactiontime=7            //开奖动画超时
            endactiontime=4                //结算动画超时
            zhuanglimit=500                //上庄资金限制
            zhuangturn=8                //庄局数
            betcount=100,500,1000,5000,10000,50000,100000,       //一次下注的数量
            maxclearcount=3                //最大清除次数
            maxrobotzhuang=3            //最多多少个机器人上庄
            robotxiazhuang=10            //机器人下庄概率百分比
            robotzhuang=10                //没有人当庄的时候机器人当庄的概率百分比
            winline=1500000                //第二条水线,当水池低于此数值,进入咬钱模式
            sametimebetmode=0             //是否開啟庄閒同時下注的配置 0:close, 1:open
            betlimitmoney=50             //下注限制
            single=1                    //单间房是否可直接入场 0:不可 1：可
            publiczhuang=0              //是否開放用戶上庄 0:close, 1:open
            luckystarround=5            //幸運星持續局數
            pokertype=1                    //1随机发牌 2 发牌器发牌
            deallog=2                    //牌局记录器类型 0 不记录 1 文本 2 db
            prettyrate=50                //前兩張秀出好牌的概率，永遠不出豹子
            syspoolmode=2               //系統水池模式 0:無水池, 1:單機模式, 2:資料庫模式
            syspoolctrlrate=25          //系統水池，開系統有利獎的機率

            [robot]
            enable=1                                        //是否开启机器人
            logoninterval=30                                //加载机器人时间间隔
            minmneyamount=500000                                //机器人最小金币数
            maxmoneyamount=100000000                        //机器人最大金币数
            queuecheckwaitspan=5,10                            //配桌检查时间间隔
            queueagainwaitspan=3,5                            //继续配桌时间间隔
            tablemaxusercount=500                            //配桌时桌子上最大人数
            tableminusercount=0                                //配桌时桌子上最小人数
            gameendleaveodds=0.5                            //游戏结束时离开游戏几率
            autositwaitspan=1,3                            //主动入座时间间隔
            gameactionwaitspan=1,4                            //游戏动作响应时间间隔
            gamereadywaitspan=3,5                            //游戏准备响应时间间隔
            maxusergameendleaveodds=1                        //人数达到上限时离开游戏几率
            maxcardsrndlvl=1                                //机器人换牌概率值
            matchtablemode=0                            //配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人 2固定配機器人可配置上限
            tablematchrobotrate=60,100     //為機器人人數,100機率%.  桌子隨機配N個機器人. 機率要設滿100%

            [gamequeue]
            gamematchwaitmintime=1        //撮合时间间隔范围小值,单位秒
            gamematchwaitmaxtime=2        //撮合时间间隔范围大值,单位秒
            againstsameip=0                //同IP不分配一起
            againstlastgame=0            //最后一次游戏过的用户不分配一起
            gameendaction=0                //游戏结束后动作,0 无动作 1 准备
            queuetype=1                    //撮合类型 0 时间随机 1 固定人数
            queueusercount=1            //排队人数
            queuetimeout=2                //排队人数超时

            [hhdz]
            count=10
            1=2485,2,1,10000000//紅 //1类型，8概率，2倍率，100一次下注的钱,100000000下注限制，此概率为庄闲和的概率。
            2=2485,2,1,10000000//黑
            3=5030,1,1,10000000//自然機率
            4=22,11,1,900000//豹子，機率權重總和為分母
            5=24,6,1,900000//順金
            6=326,4,1,900000//金花
            7=496,3,1,900000//順子
            8=846,2,1,900000//對子(9-A)
            9=847,1,1,900000//對子(2-8)
            10=7439,1,10,900000//單張
            
            [supertool]
            ctrlbetlimit=1000 // 監控名單會控制的最低注額(分)

            [0]
            count=10
            1=4497,2,1,10000000//紅 //1类型，8概率，2倍率，100一次下注的钱,100000000下注限制，此概率为庄闲和的概率。
            2=4497,2,1,10000000//黑
            3=1006,1,1,10000000//自然機率
            4=52,11,1,900000//豹子，機率權重總和為分母
            5=48,6,1,900000//順金
            6=1096,4,1,900000//金花
            7=720,3,1,900000//順子
            8=1728,2,1,900000//對子(9-A)
            9=2016,1,1,900000//對子(2-8)
            10=16440,1,1,900000//單張

            [2500000]
            count=10
            1=3485,2,1,10000000//紅 //1类型，8概率，2倍率，100一次下注的钱,100000000下注限制，此概率为庄闲和的概率。
            2=3485,2,1,10000000//黑
            3=3030,1,1,10000000//自然機率
            4=140,11,1,900000//豹子，機率權重總和為分母
            5=196,6,1,900000//順金
            6=626,4,1,900000//金花
            7=800,3,1,900000//順子
            8=1250,2,1,900000//對子(9-A)
            9=588,1,1,900000//對子(2-8)
            10=6400,1,1,900000//單張
          robot.dat: |
            [csize]
            cn=6

            [c1]
            //正常机器人
            betcount=5,500    //一次下注的数量随机
            bettype=1,2        //下注类型
            line=50000       //龙，虎平衡线

            [c2]
            //正常机器人
