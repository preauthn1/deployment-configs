game:
  dczz:
    id: 2003
    name: 賭場戰爭
    group: poker
    room:
      - serverid: 200300410
        configs:
          gameserver.dat: |
            [gameserver]
            gameid=2003                                       // 遊戲ID
            gamename=賭場戰爭                                  // 遊戲名稱
            flag=41                                           // 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=3                                       // 遊戲最小人數
            maxplayer=3                                       // 遊戲最大人數
            tablecount=100                                    // 桌子數
            seatcount=3                                       // 椅子數
            loginmoney=1000                                   // 進入遊戲最小積分
            scoremode=0                                       // 0 即時寫分 1退房間寫分
            maxuser=500                                       // 最大人數
            taxscale=5                                        // 抽水比例
            readywaittime=6                                   // 舉手超時時間,單位秒
            reghallserverinterval=60                          // 註冊廣場時間間隔,單位秒
            basescore=10                                      // 底分
            opttime=8                                         // 可操作時間，單位秒
            bet=10,20,30,50,                                  // 下注分數
            retaction=5                                       // 結算動畫超時
            fapaiaction=2                                     // 發牌動畫超時
            betaction=2                                       // 下注飛金幣動畫
            compareaction=3                                   // 比牌動畫
            pokertype=1                                       // 1隨機發牌 2 發牌器發牌
            maxturn=5                                         // 最多好多輪以後不會棄牌了，自動比牌
            deallog=2                                         // 牌局記錄器類型0 不記錄 ,1 文本, 2 db
            checkturn=1                                       // 多少輪以後可以看牌
            maxgamecountsametable=0                           // 同一桌最大遊戲次數
            matchmakingtime=5                                 // 未滿遊戲最小人數的等待時間
            matchmakingnumber=1                               // 開始倒數時間的最低人數
            radomnickname=1                                   // 特殊名稱的開關 0 關閉 1 開啟
            gametimeout=10
            kickoutmoney=0                                    // 達到此積分，強制退出房間
            reversepokerorder=1                               // 發牌順序是否要改成逆時針 0 順時針 1 逆時針

            [gamequeue]
            gamematchwaitmintime=1                            // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=3                            // 撮合時間間隔範圍大值,單位秒
            againstsameip=0                                   // 同IP不分配一起
            againstlastgame=0                                 // 最後一次遊戲過的用戶不分配一起
            gameendaction=0                                   // 遊戲結束後動作,0 無動作 1 準備
            queuetype=0                                       // 撮合類型 0 時間隨機 1 固定人數 2輸贏對戰
            queueusercount=3                                  // 排隊人數
            queuetimeout=3                                    // 排隊人數超時
            lessthanuser=10                                   // 低於幾人不採用分桌機制

            [robot]
            enable=1                                          // 是否開啟機器人
            logoninterval=30                                  // 加載機器人時間間隔
            minmneyamount=1000                                // 機器人最小金幣數
            maxmoneyamount=6000                               // 機器人最大金幣數
            queuecheckwaitspan=3,5                            // 配桌檢查時間間隔
            queueagainwaitspan=3,5                            // 繼續配桌時間間隔
            tablemaxusercount=5                               // 配桌時桌子上最大人數
            tableminusercount=1                               // 配桌時桌子上最小人數
            gameendleaveodds=1                                // 遊戲結束時離開遊戲機率
            autositwaitspan=1,3                               // 主動入座時間間隔
            gameactionwaitspan=1,2                            // 遊戲動作響應時間間隔
            gamereadywaitspan=1,5                             // 遊戲準備相應時間間隔
            maxusergameendleaveodds=0                         // 人數達到上限時離開遊戲機率
            maxcardsrndlvl=1                                  // 機器人換牌概率0-10
            againstgameing=1                                  // 進入正在遊戲中的(觀戰) 0是 1否
            matchtablemode=0                                  // 配桌方式, 0輪詢桌子每次放一個機器人 1輪詢桌子每次放N個機率機器人
            tablematchrobotrate=1,0|2,40|3,33|4,27            // 為機器人人數,20機率%. 桌子隨機配N個機器人.分母為固定值,所有數字總和需為100

            Rate_FoldAtWar=5                                  // 進入戰爭後棄牌機率
            BetRange_Base=1,7,2                               // 下底注範圍，例如設定1,7,2：1,7為籌碼編號1-7，2為最大的下注次數，系統會隨機決定下注次數
            BetRange_Side=1,7,2                               // 下平手注範圍，例如設定1,7,2：1,7為籌碼編號1-7，2為最大的下注次數，系統會隨機決定下注次數

            [GameSetting]
            Timeout_WaitingStart=6                            // 等待遊戲開始 timeout
            Timeout_Betting=10                                // 下注 timeout
            Timeout_StopBettingAnimation=5                    // 停止下注動畫 timeout
            Timeout_Shuffle=5                                 // 洗牌動畫 timeout
            Timeout_Deal_Normal=5                             // 一般發牌動畫 timeout
            Timeout_Settlement_Normal=10                      // 一般結算 timeout
            Timeout_WarSelection=6                            // 選擇是否進入戰爭 timeout
            Timeout_WarPhaseBegin=2                           // 進入戰爭階段動畫 timeout
            Timeout_Deal_War=5                                // 戰爭發牌動畫 timeout
            Timeout_Settlement_War=10                         // 戰爭結算 timeout

            ChipValue=100,1000,5000,10000,50000,100000,500000 // 籌碼面額
            BetLimit_Base=500000                              // 底注額上限
            BetLimit_Side=500000                              // 平手額上限

