game:
  dfdc:
    id: 1023
    name: 多福多財
    group: slot
    room:
      - serverid: 102300410
        proto: dfdc
        configs: 
          gameserver.dat: |
            [gameserver]
            gameid=1023				 	                // 遊戲ID
            gamename=多福多財  		 	              // 遊戲名稱
            flag=41                             // 顯示名稱,客戶端可根據此名稱將房間分類顯示
            minplayer=1                         // 遊戲最小人數
            maxplayer=1                         // 遊戲最大人數
            tablecount=480                      // 桌子數
            seatcount=1                         // 椅子數
            loginmoney=0                        // 進入遊戲最小積分
            scoremode=0                         // 0 即時寫分 1 退房間寫分 2 比賽 3 分段寫分
            maxuser=480                         // 最大人數
            taxscale=0                          // 抽水比例
            readywaittime=10                    // 舉手超時時間,單位秒
            reghallserverinterval=5             // 註冊廣場時間間隔,單位秒
            basescore=100                       // 底分
            deallog=2                           // 牌局記錄器類型 0 不記錄 ,1 文本, 2 db, 3 fish, 4分段寫分
            mincarrymoney=0                     // 下注攜帶金額限制

            [gamequeue]
            gamematchwaitmintime=1              // 撮合時間間隔範圍小值,單位秒
            gamematchwaitmaxtime=3              // 撮合時間間隔範圍大值,單位秒
            againstsameip=0                     // 同IP不分配一起
            againstlastgame=0                   // 最後一次遊戲過的用戶不分配一起
            gameendaction=0                     // 遊戲結束後動作,0 無動作 1 準備
            queuetype=1                         // 撮合類型 0 時間隨機 1 固定人數
            queueusercount=1                    // 排隊人數
            queuetimeout=2                      // 排隊人數超時
          slotconfig.dat: |
            [slotsetting]
            endactiontime=1				              // 結算動畫超時
            betcount=5,10,20,30,60,100          // 一次下注的數量
            betrate=8,18,38,68,88               // 玩家可上調的基本押注數量的倍率

            slotpattern=13                      // 參考csv SlotPattern類型, 可多個用逗號分
            releasepattern=13                   // 放分
            bitepattern=13                      // 咬分
            bigwinrule=150,750,1350,1950        // client動畫播放階段,以Bet為主
            bigwinnotify=750                    // 當下注16, Total=12,000‬(16*750) 得獎超過12,000才廣播.
            isSlideShow=0                       // 中獎時，是否逐條派彩線輪播(未實做)
            isRetriggered=1                     // Free Spin 過程中，是否能再觸發Free Spin(未實做)
            freeSpinLimit=0                     // Free Spin最多可累積的數量(未實做)
