# Default values for tgbot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: example.invalid/target/tgbot/tg_hook_api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets:
  - name: regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations:
    example.invalid/ingress.class: nginx
    example.invalid/proxy-body-size: '0'
    example.invalid/ssl-redirect: 'false'
    # example.invalid/ingress.class: nginx
    # example.invalid/tls-acme: "true"
  hosts:
    - host: example.invalid
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: example.invalid-tls
      hosts:
        - example.invalid
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

appsettings:
  ThirdParty:
    RedisConn: 0.0.0.0:6379,abortConnect=False
    RedisDBNumber: 8
    RedisTimeoutSeconds: 3
  Env: Production
  WebSiteName: TG_Hook_API.Production
  debugSiteUrl: http://example.invalid/
  IsEnableCache: true
  IsRemoteCache: true
  TgBotToken: [REDACTED]
  Vworld_API_URL: https://example.invalid/
  Vworld_API_MD5_KEY: "&zSMvVTK4gbDvCcU"
  Vworld_API_AES_KEY: "M53B?xKnTVtVnjM^"
  Vworld_API_IV: "3579653693526433"
  AllowedHosts: "*"
  
