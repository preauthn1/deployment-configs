# alfawin77（prod）環境 values
# 目標叢集：gff-alfawin77 / cluster-alfawin77（asia-southeast1-a）/ ns default
#   （比照 .gitlab-ci-jobs/deploy-to-prods/alfawin77.yaml 的 apis 部署目標）
# 慣例來源：helm-charts/apis/values_alfawin77.yaml 與本 chart values_vwb2c.yaml / values_vworldmy.yaml

# autoscaling 啟用時 replicaCount 不生效，此值僅供關閉 HPA 時 fallback
replicaCount: 2

# 比照本 chart vwb2c / vworldmy 的 prod autoscaling 配置
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# 比照本 chart vwb2c / vworldmy 的 prod 資源規格
# （agent-backend 為單容器：nginx 靜態檔 + Nitro gateway，負載遠輕於 PHP-FPM）
resources:
  limits:
    cpu: 0.5
    memory: 1024Mi
  requests:
    cpu: 0.2

# 對外入口：apis 各 prod values 均未啟用 chart ingress（對外流量入口由叢集側管理），此處比照維持關閉
# TODO(拍板)：alfawin77 代理後台的對外網域尚無現成慣例可推導
#   （apis alfawin77 既有網域：example.invalid / example.invalid /
#    example.invalid，無 agent/代理後台前綴慣例），待決定網域與入口管理方式
#   （叢集側 LB 或啟用本 chart ingress）
ingress:
  enabled: false

# gateway runtime secrets for alfawin77 (prod)
# 與 dev 同樣由本 chart secret.yaml 建 Secret、deployment 以 secretKeyRef 注入。
gateway:
  # gateway server-side session 加密密碼（h3 useSession 要求 >= 32 字元，僅 gateway 自用不需對齊他系統）
  # 本值為 2026-08-04 新產生之 32 字元隨機密鑰（alfawin77 專用，未沿用 dev / vworldmy / vwb2c）
  SESSION_PASSWORD: [REDACTED]"
  # 與 apis values_alfawin77.yaml 之 app.api.* 一致（gateway 加簽轉發用）：
  #   AES_KEY ← app.api.aes_key、AES_IV ← app.api.aes_iv、MD5_KEY ← app.api.aes_md5
  AES_KEY: "b6tZEAWcjUmP72f^"
  AES_IV: "1055672522457459"
  MD5_KEY: "&ZhPsS9jRT6A4yVz"
  # API_URL：agent-console API（dev 慣例為 agent-console-api-service:60003；此處比照 vworldmy / vwb2c
  # 最終定案的叢集內 service 名稱 agent-webapi-service）
  # TODO(確認)：alfawin77 叢集內該 service 名稱/port 與是否已部署，待維運確認
  API_URL: "http://agent-webapi-service:60003/"
  # apis 於 alfawin77 為 split 模式（deploy job DEPLOY_MODE: split），代理後台面向的 Service 為
  # apis-agent（ClusterIP:80；service 名由 apis chart service.yaml 之 {{ .Release.Name }}-agent 推導）
  APIS_URL: "http://apis-agent/"
  # TODO(確認)：alfawin77 叢集內是否存在 api-internal service（dev 值為 http://api-internal/，
  # 且 dev 環境本就不可達）
  API_INTERNAL: "http://api-internal/"
  # 客服系統 API 加簽三鍵，來源：html/gsrc/WEB_CustomerServiceSocket/_release/.env.alfawin77
  #   （branch alfawin77；server-build-alfawin77/Dockerfile-php:65 COPY _release/.env.alfawin77 /app/.env，
  #    cloudbuild 部署至 gff-alfawin77 / cluster-alfawin77 / asia-southeast1-a，與本檔目標叢集一致）
  #   對應：CS_AES_KEY ← API_AES_KEY、CS_MD5_KEY ← API_MD5_KEY、CS_IV ← API_IV
  #   注意：alfawin77 的 CS 三鍵與 apis app.api.* 恰為同一組值（非誤填；vworldmy / vwb2c 兩者不同，
  #        此品牌 CS 與 apis 共用同一組加簽鍵）
  CS_AES_KEY: "Q2R9q8CKr6P5XnpJ"
  CS_MD5_KEY: "YWgrkS8jBTQp5KnM"
  CS_IV: "4336962983334717"
  # CS_API_URL：走叢集內 CS API service。已確認存在：
  #   WEB_CustomerServiceSocket/server-build-alfawin77/webapi-service.yaml → Service cs-api-service，
  #   port 60003 → targetPort 80，部署於同一叢集 cluster-alfawin77
  #   （外網域備援值為 apis api_cs_url：https://example.invalid/api/）
  CS_API_URL: "http://cs-api-service:60003/"
  # 比照 apis values_alfawin77.yaml 的 api_cs_url 網域
  CS_SOCKET_URL: "https://example.invalid/"

  # target/tickets#4187：GKE+GCLB 拓樸，X-Forwarded-For 最後一格是 GCLB 自己的
  # 前端 VIP（無法枚舉），跟 apis/WEB_AgentBackend 同品牌設定一致。
  TRUSTED_PROXY_SKIP_LAST_HOP: "true"
