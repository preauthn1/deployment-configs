apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-backend.fullname" . }}-secret
  labels:
    {{- include "agent-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_PASSWORD: {{ .Values.gateway.SESSION_PASSWORD | quote }}
  AES_KEY: {{ .Values.gateway.AES_KEY | quote }}
  AES_IV: {{ .Values.gateway.AES_IV | quote }}
  MD5_KEY: {{ .Values.gateway.MD5_KEY | quote }}
  API_URL: {{ .Values.gateway.API_URL | quote }}
  APIS_URL: {{ .Values.gateway.APIS_URL | quote }}
  API_INTERNAL: {{ .Values.gateway.API_INTERNAL | quote }}
  CS_AES_KEY: {{ .Values.gateway.CS_AES_KEY | quote }}
  CS_MD5_KEY: {{ .Values.gateway.CS_MD5_KEY | quote }}
  CS_IV: {{ .Values.gateway.CS_IV | quote }}
  CS_API_URL: {{ .Values.gateway.CS_API_URL | quote }}
  CS_SOCKET_URL: {{ .Values.gateway.CS_SOCKET_URL | quote }}
  TRUSTED_PROXY_SKIP_LAST_HOP: {{ .Values.gateway.TRUSTED_PROXY_SKIP_LAST_HOP | quote }}
  TRUSTED_PROXY_EXTRA_CIDRS: {{ .Values.gateway.TRUSTED_PROXY_EXTRA_CIDRS | quote }}
