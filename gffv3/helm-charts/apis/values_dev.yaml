# CronJob configuration
cronjob:
  enabled: true
  schedule: "* * * * *"  # Every minute
  timeZone: "UTC"
  concurrencyPolicy: "Forbid"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 100
  backoffLimit: 6
  restartPolicy: "OnFailure"
  command: "php artisan schedule:run 2>&1"
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 0.1

# Horizon queue worker (#3967)
# 只有 dev 開啟——dev 這組 Horizon 統一消費 dev/dev2/devwtt 共用佇列（D3 v2.1）
horizon:
  enabled: true
  replicas: 2  # D5：多 worker 併發行為在 dev 先受測
