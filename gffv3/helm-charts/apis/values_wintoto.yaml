# CronJob configuration
cronjob:
  enabled: true
  schedule: "* * * * *"  # Every minute
  timeZone: "UTC"
  concurrencyPolicy: "Forbid"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  backoffLimit: 6
  restartPolicy: "OnFailure"
  command: "php artisan schedule:run 2>&1"
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 0.1

# Horizon queue worker (#3967)
# vworldmy 與 wintoto 各跑一組 Horizon，共同消費同一條 redis 佇列（原子 pop 不重複），互為 HA
# maxProcesses 沿用 apis config production=20 不減量；3Gi 為 20 worker 上限保護
horizon:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 3Gi
