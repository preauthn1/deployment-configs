{{- if eq .Values.deployMode "allinone" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-allinone
  labels:
    {{- include "cm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cm.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if ne .Values.deployMode "allinone" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-external
  labels:
    {{- include "cm.externalLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cm.externalSelectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "cm.frontendLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cm.frontendSelectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent
  labels:
    {{- include "cm.agentLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cm.agentSelectorLabels" . | nindent 4 }}
{{- end }}