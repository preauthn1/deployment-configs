    port: 6379
    db: 0
    # 佇列專用 db，避開 db 0 的 session/cache
    queue_db: "3"
  # Horizon 儀表板（#3967）：IP 白名單 + trusted proxies
  horizon:
    allowed_ips: "0.0.0.0"
    # '*' 只信任直連的一跳（TrustProxies setTrustedProxyIpAddressesToTheCallingIp），
    # 本站鏈路 XFF 實測 client → GCLB(0.0.0.0) → 叢集內(0.0.0.0) 兩層 proxy，
    # '*' 會把 client IP 解成 GCLB 造成白名單 403。改列明確清單
    # （叢集網段 + 本站 GCLB IP + GCLB backend 網段）沿 XFF 剝到真實 client IP。
    trusted_proxies: "0.0.0.0/16,0.0.0.0,0.0.0.0/22,0.0.0.0/16"
  # target/tickets#4187：resolveClientIp() 信任鏈設定（跟上面 horizon.trusted_proxies
  # 是不同路徑、不同拓樸——這條是 /frontend/api/detect_ip 實測出來的，Envoy-based
  # LB，鏈路是 client → 0.0.0.0（多次實測穩定不變）→ 浮動的最後一跳（每次
  # 不同，見 skip_last_hop）。
  #
  # target/op_tickets#3478：補上 0.0.0.0。查本站 Loki 近 72 小時所有多節 XFF 的
  # nginx access log（4,998 筆，鏈長一律 3 節），倒數第二節只有兩個值：
  #   0.0.0.0  4,969 筆  各網域目前的 DNS 解析目標
  #   0.0.0.0     29 筆  輪換前的舊 VIP，遊戲商回調仍走這個入口
  #                            （實際路徑 /external/api/sw/astar/gamepool/vpl3）
  # 少了它，那些請求 pop 掉最後一跳後會掃到它、它不在信任清單內，於是被當成
  # 客戶端 IP 回傳。確認過不是偽造：
  #   - 它恆定在第 1 節，而位置 0 的來源有 8 個互不相干的網段（含 Shodan 掃描器），
  #     客戶端控制得了的欄位不會這樣固定
  #   - RDAP 屬 Google LLC（0.0.0.0-0.0.0.0 GOOGL-2）
  #   - 直連該 IP:443 取得的憑證由 Google Trust Services 簽發，SAN 為本站網域
  #     （agent-backend / api-external / api / cs-api / cs-backend / cs-socket /
  #     cs / m / www / example.invalid），只有網域擁有者申請得到
  #   - 全 repo 搜過，沒有任何白名單拿它當「允許來源」，信任它不會讓別處失效
  # 舊後台 _release/_init.php.vplus33 的 TRUSTED_PROXY_EXTRA_CIDRS 早已同時列這兩筆。
  trusted_proxy:
    extra_cidrs: "0.0.0.0/32,0.0.0.0/32"
    skip_last_hop: true
