# CronJob configuration
cronjob:
  enabled: true
  schedule: "* * * * *"  # Every minute
  timeZone: "UTC"
  concurrencyPolicy: "Forbid"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  backoffLimit: 6
  restartPolicy: "OnFailure"
  command: "php artisan schedule:run 2>&1"
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 0.1

# Horizon queue worker (#3967)
# 單站獨立部署，一組 Horizon 消費自己的 redis 佇列（獨立 redis/mysql，不與其他品牌共用）
# sizing：maxProcesses 沿用 apis config production=20；3Gi 為 20 worker 上限保護
horizon:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 3Gi
