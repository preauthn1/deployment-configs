environment: production

migration:
  seedDatabase: false
  clearCache: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

job:
  activeDeadlineSeconds: 300    # 5 minutes

waitForDatabase:
  enabled: false

imagePullSecrets:
  - name: ar-secret

env:
  SITE_NAME: vplus33
  APP_NAME: Laravel_Migration
  APP_ENV: prod
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  DB_PORT: 3306
  DB_DATABASE: xsgcasino
  DB_LOG_DATABASE: xsgcasino_log
  DB_HOST_READ: mysql-service.mysql.svc.cluster.local
  DB_USERNAME_READ: developer
  DB_PASSWORD_READ: "!QAZ2wsxForXSGames_online"
  DB_HOST_WRITE: mysql-service.mysql.svc.cluster.local
  DB_USERNAME_WRITE: developer
  DB_PASSWORD_WRITE: "!QAZ2wsxForXSGames_online"
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
