{{- if or (hasKey .Values.config "NUXT_DEV_HOST_OVERRIDE") (hasKey .Values.secrets "NUXT_DEV_HOST_OVERRIDE") }}
{{- fail "NUXT_DEV_HOST_OVERRIDE 只供本機開發：設了會讓所有網域都解析成同一個站台，部署環境禁止設定" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-frontend.fullname" . }}
  labels:
    {{- include "web-frontend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "web-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Secret 內容變了 k8s 不會自動 rollout，靠 checksum 讓 pod template 跟著變
        # （比照 agent-backend chart，target/tickets#4187）
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "web-frontend.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        version: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
    spec:
      # preStop 20s + Nitro graceful shutdown 上限 NITRO_SHUTDOWN_TIMEOUT 25s = 45s，留 15s 餘裕
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "web-frontend.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NITRO_PORT
              value: "3000"
            - name: NITRO_HOST
              value: "0.0.0.0"
            - name: NITRO_SHUTDOWN_TIMEOUT
              value: "25000"
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $_ := .Values.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "web-frontend.fullname" $ }}-secret
                  key: {{ $key }}
            {{- end }}
          # endpoint 反註冊與 SIGTERM 同時發生，先等 20s 讓 NEG 反註冊傳播完再關 listener，
          # 避免滾更期間 503（agent-backend dev 實測過同樣問題）
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 20"]
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
