image: google/cloud-sdk:latest

variables:
  TRIGGER_FROM_PROJECT: target/gffv3/apis
  SRC_TITLE: ${SRC_COMMIT_BRANCH}${SRC_COMMIT_TAG}

workflow:
  name: "[${SRC_PROJECT}:${SRC_TITLE}] ${SRC_SHORT_SHA}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      variables:
        CI_PIPELINE_DESCRIPTION: "desc_${CI_PIPELINE_NAME}"

stages:
  - info
  - choose-env
  - deploy

info:
  stage: info
  tags:
    - php
  script:
    - uname -r
    - curl -s example.invalid
    - echo $SRC_COMMIT_BRANCH
    - echo $SRC_SHORT_SHA
    - echo $SRC_PROJECT
    - echo $SRC_IMAGE
    - echo $BUILD_NAME
    - echo $CI_BUILD_TARGETS


############################################################
# Extends required variables
# 建置來源專案
# TRIGGER_FROM_PROJECT: target/gffv3/apis
# AR_PATH: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024
# 應用名
# DEPLOYMENT_NAME: apis
# APP_NAME: Laravel
# GKE 叢集
# GKE_CLUSTER_NAME: cluster-1
# GKE_CLUSTER_ZONE: asia-east1-a
# GCP_PROJECT: tp-wz3-rd
# 部署命名空間
# DEPLOY_NS: cm
# DEPLOY_KEY_FILE: deploy-keys/tp-wz3-rd-deploy.json
# HELM_CHART_PATH: helm-charts/apis
# DEPLOY_VALUES_FILE: helm-charts/apis/values.yaml
############################################################
.migration:
  stage: deploy
  image: google/cloud-sdk:latest
  tags:
    - php
  before_script:
    - make setup-tools
    - make debug-info
  script:
    - make deploy-gcp
    - make wait-job-deployment

############################################################
# 建置來源專案
