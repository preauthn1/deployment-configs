    # 應用名
    DEPLOYMENT_NAME: apis
    APP_NAME: Laravel
    APP_PORT: 80
    # GKE 叢集
    GKE_CLUSTER_NAME: cluster-1
    GKE_CLUSTER_ZONE: asia-east1-a
