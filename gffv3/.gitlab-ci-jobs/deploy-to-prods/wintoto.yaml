.release_prod_rule: &release_prod_rule
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $SRC_PROJECT == $TRIGGER_FROM_PROJECT && $SRC_COMMIT_TAG =~ /^release_\d+$/'
    - when: never
    
choose tp-wz3-online (wintoto):
  <<: *release_prod_rule
  stage: choose-env
  tags:
    - php
  needs:
    - "info"
  when: manual
  script:
    - echo "choose tp-wz3-online (wintoto)"

## Witoto 不需要 migration

deploy to tp-wz3-online (wintoto):
  <<: *release_prod_rule
  extends: .deploy-app-echo-variables
  stage: deploy
  tags:
    - php
  needs:
    - "choose tp-wz3-online (wintoto)"
  variables:
    # 建置來源專案
    TRIGGER_FROM_PROJECT: target/gffv3/apis
    AR_PATH: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024
    # 應用名
    DEPLOYMENT_NAME: apis
    APP_NAME: Laravel
    APP_PORT: 80
    # GKE 叢集
    GKE_CLUSTER_NAME: wintoto-cluster
    GKE_CLUSTER_ZONE: asia-southeast1-a
    GCP_PROJECT: tp-wz3-online
    # 部署命名空間
    DEPLOY_NS: default
    # 部署模式
    DEPLOY_MODE: split
    # 部署金鑰
    DEPLOY_KEY_FILE: deploy-keys/tp-wz3-rd-deploy.json
    # HELM 圖表路徑
    HELM_CHART_PATH: helm-charts/apis
    # 部署值檔案
    DEPLOY_VALUES_FILE: helm-charts/apis/values_wintoto.yaml
  before_script:
    - apt-get update -qq && apt-get install -y -qq make
    - make setup-tools
    - make debug-info
  script:
    - make deploy-gcp

############################################################
# agent-backend（新後台前端）→ wintoto
# 比照 .gitlab-ci-jobs/deploy-to-rd.yml 的 SRC_PROJECT 分流：
# 僅在 target/gffv3/agent-backend 以 release_N tag trigger 時出現，
# 不與上方 apis 的 jobs 混流；前端無 DB，不需 migration job
############################################################
.release_agent_backend_prod_rule_wintoto: &release_agent_backend_prod_rule_wintoto
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $SRC_PROJECT == "target/gffv3/agent-backend" && $SRC_COMMIT_TAG =~ /^release_\d+$/'
    - when: never

choose agent-backend tp-wz3-online (wintoto):
  <<: *release_agent_backend_prod_rule_wintoto
  stage: choose-env
  tags:
    - php
  needs:
    - "info"
  when: manual
  script:
    - echo "choose agent-backend tp-wz3-online (wintoto)"

deploy agent-backend to tp-wz3-online (wintoto):
  <<: *release_agent_backend_prod_rule_wintoto
  extends: .deploy-app-echo-variables
  stage: deploy
  tags:
    - php
  needs:
    - "choose agent-backend tp-wz3-online (wintoto)"
  variables:
    # 建置來源專案
    TRIGGER_FROM_PROJECT: target/gffv3/agent-backend
    AR_PATH: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024
    # 應用名
    DEPLOYMENT_NAME: agent-backend
    APP_NAME: AgentBackend
    APP_PORT: 8080
    # GKE 叢集
    GKE_CLUSTER_NAME: wintoto-cluster
    GKE_CLUSTER_ZONE: asia-southeast1-a
    GCP_PROJECT: tp-wz3-online
    # 部署命名空間
    DEPLOY_NS: default
    # 部署金鑰
    DEPLOY_KEY_FILE: deploy-keys/tp-wz3-rd-deploy.json
    # HELM 圖表路徑
    HELM_CHART_PATH: helm-charts/agent-backend
    # 部署值檔案
    DEPLOY_VALUES_FILE: helm-charts/agent-backend/values_wintoto.yaml
  before_script:
    - apt-get update -qq && apt-get install -y -qq make
    - make setup-tools
    - make debug-info
  script:
    - make deploy-gcp
