{{- if .example.invalid.scaleble }}
apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "backend-api.fullname" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "backend-api.fullname" . }}
{{- if .example.invalid.min_replicas }}
  minReplicas: {{ .example.invalid.min_replicas }}
{{- else }}
  minReplicas: 2
{{- end }}
  maxReplicas: 30
  metrics:
  {{- if .Values.hpa.metrics }}
    {{- toYaml .Values.hpa.metrics | nindent 4 }}
  {{- else }}
  - type: Resource
    resource:
      name: cpu
      targetAverageUtilization: 70
  - type: Resource
    resource:
      name: memory
      targetAverageUtilization: 65
  {{- end}}
{{- end }}
