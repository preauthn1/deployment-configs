{{- range $tlsSecretName, $tlsSecret := .Values.tlsSecrets }}
apiVersion: v1
kind: Secret
type: example.invalid/tls
metadata:
  name: {{ $tlsSecretName }}
  labels:
    release: {{ $.Release.Name }}
data:
  tls.crt: {{ $.Files.Get $tlsSecret.certificate | b64enc }}
  tls.key: {{ $.Files.Get $tlsSecret.key | b64enc }}
---
{{- end }}