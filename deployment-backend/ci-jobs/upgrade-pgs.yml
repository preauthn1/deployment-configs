.api:
  stage: upgrade-target
  tags:
    - dotnet
  image: alpine/k8s:1.18.2
  only:
    - master
  before_script:
    - mkdir -p $HOME/.kube
    - echo $KUBE_CONFIG | base64 -d > $HOME/.kube/config
    - chmod 600 $HOME/.kube/config
    - kubectl config view
  script:
    - echo "Deploy start ..."
    - echo ${APP_TAG}
    - helm upgrade backend-api-${APP_NAME} ./api -f ./api/${DEPLOY_VALUES_FILE} --install --namespace ${DEPLOY_NS}
      --set image.repository=${APP_IMAGE}
      --set image.tag=${APP_TAG}
      --set service.port=${APP_PORT}
      --set app.name=${APP_NAME}
      --set app.scaleble=${SCALEBLE}
      --set app.min_replicas=${MIN_REPLICAS}
    - echo "Deploy completed!"
  when: manual

