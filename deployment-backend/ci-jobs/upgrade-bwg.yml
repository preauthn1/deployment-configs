.api-bwg:
  stage: upgrade-bwg
  tags:
    - dotnet
  image: alpine/k8s:1.18.2
  only:
    - master
  before_script:
    - mkdir -p $HOME/.kube
    - echo $KUBE_CONFIG_BWG | base64 -d > $HOME/.kube/config
    - chmod 600 $HOME/.kube/config
    - kubectl config view
  script:
    - echo "Deploy start ..."
    - echo ${APP_TAG}
    - helm upgrade backend-api-${APP_NAME} ${HELM_PATH} -f ${DEPLOY_VALUES_FILE} --install --namespace ${DEPLOY_NS}
      --set image.repository=${APP_IMAGE}
      --set image.tag=${APP_TAG}
      --set service.port=${APP_PORT}
      --set app.name=${APP_NAME}
      --set autoscaling.enabled=${SCALEBLE}
      --set autoscaling.minReplicas=${MIN_REPLICAS}
    - echo "Deploy completed!"
  needs: [] # 移除对其他阶段的依赖
  when: manual

BWG AdminSys API:
  extends: .api-bwg
  variables:
    HELM_PATH: ./bwg-api
    APP_NAME: adminsys
    APP_IMAGE: example.invalid/target/backend/target.api.adminsys
    APP_TAG: gh-39969237019-1
    APP_PORT: 3102
    DEPLOY_NS: bwg
    DEPLOY_VALUES_FILE: ./values/bwg/values.yaml

