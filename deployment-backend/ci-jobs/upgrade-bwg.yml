BWG 管理後台 Portal:
  variables:
    APP_TAG: 54118
  stage: upgrade-bwg
  tags:
    - dotnet
  image: alpine/k8s:1.18.2
  only:
    - master
  before_script:
    - mkdir -p $HOME/.kube
    - echo $KUBE_CONFIG_BWG | base64 -d > $HOME/.kube/config
    - chmod 600 $HOME/.kube/config
    - kubectl config view
  script:
    - echo "Deploy start ..."
    - ls -al $HOME/.kube
    - helm upgrade backend-portal ./bwg-portal -f ./values/bwg/values-portal.yaml --install --namespace bwg
      --set image.tag=${APP_TAG}
    - echo "Deploy completed!"
  when: manual
