apiVersion: example.invalid/v1
kind: Certificate
metadata:
  name: wildcard-target-com
  namespace: cert-manager
spec:
  secretName: wildcard-target-com-tls
  dnsNames:
    - "example.invalid"
    - "*.example.invalid"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  duration: 2160h # 90天
  renewBefore: 360h # 15天前开始续期 