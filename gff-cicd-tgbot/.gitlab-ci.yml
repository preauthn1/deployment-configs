image: google/cloud-sdk:latest

variables:
  SRC_TITLE: ${SRC_COMMIT_REF_NAME}${SRC_COMMIT_TAG}
  # 建置來源專案
  TRIGGER_FROM_PROJECT: target/tgbot-php
  AR_PATH: asia-east1-docker.pkg.dev/tp-wz3-rd/bucket2024

workflow:
  name: "[${SRC_PROJECT_PATH}:${SRC_COMMIT_REF_NAME}] ${SRC_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      variables:
        CI_PIPELINE_DESCRIPTION: "desc_${CI_PIPELINE_NAME}"

stages:
  - info
  - choose-env
  - deploy

info:
  stage: info
  tags:
    - php
  script:
    - uname -r
    - curl -s example.invalid
    - echo $SRC_COMMIT_REF_NAME
    - echo $SRC_COMMIT_SHA
    - echo $SRC_PROJECT_PATH

include:
  - .gitlab-ci-jobs/deploy-to-rd.yml
  - .gitlab-ci-jobs/deploy-to-prods/vworldmy.yaml
  - .gitlab-ci-jobs/deploy-to-prods/vplus33.yaml
  - .gitlab-ci-jobs/deploy-to-prods/vwb2c.yaml
  - .gitlab-ci-jobs/deploy-to-prods/tpower.yaml

