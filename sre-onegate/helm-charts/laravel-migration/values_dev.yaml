environment: development

migration:
  seedDatabase: true
  clearCache: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

job:
  activeDeadlineSeconds: 300    # 5 minutes

waitForDatabase:
  enabled: false
  
env:
  SITE_NAME: dev
  APP_NAME: Laravel_Migration
  APP_ENV: dev
  APP_DEBUG: "true"
  DB_CONNECTION: mysql
  DB_PORT: 3306
  DB_DATABASE: onegate
  DB_HOST_READ: 0.0.0.0
  DB_USERNAME_READ: developer
  DB_PASSWORD_READ: "!QAZ2wsxForXSGames"
  DB_HOST_WRITE: 0.0.0.0
  DB_USERNAME_WRITE: developer
  DB_PASSWORD_WRITE: "!QAZ2wsxForXSGames"
  LOG_CHANNEL: stderr
  LOG_LEVEL: debug
