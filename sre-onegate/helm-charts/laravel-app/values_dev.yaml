# CronJob configuration
cronjob:
  enabled: false
  schedule: "* * * * *"  # Every minute
  timeZone: "UTC"
  concurrencyPolicy: "Forbid"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 100
  backoffLimit: 6
  restartPolicy: "OnFailure"
  command: "php artisan schedule:run --silent 2>&1"
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 0.1
# Queue Work configuration
qwork:
  enabled: false
  command: "php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --queue=notifications,default"
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 0.1